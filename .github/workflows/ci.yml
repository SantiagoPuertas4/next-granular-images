name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / sharp ${{ matrix.sharp }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
        sharp: ['0.33.5', '0.34.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Check Node version (>= 20.19)
        run: node -e "const [a,b]=process.versions.node.split('.').map(Number); if (a===20 && b<19) { console.error('Node ' + process.version + ' < 20.19'); process.exit(1) }"

      - run: pnpm install --frozen-lockfile

      - name: Use sharp ${{ matrix.sharp }}
        if: matrix.sharp != '0.33.5'
        run: pnpm add --save-dev --save-exact sharp@${{ matrix.sharp }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: npm pack --dry-run
